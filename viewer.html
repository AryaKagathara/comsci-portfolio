<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer | Arya Kagathara</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KKXL77TH7M"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-KKXL77TH7M');
    </script>
</head>

<body class="viewer-body">
    <nav class="viewer-nav">
        <img src="Logo.png" alt="Logo" class="logo-img" style="height: 32px;">
        <h2 id="pdf-title">Loading Document...</h2>
    </nav>

    <main class="viewer-container">
        <div id="pdf-viewer-content">
            <!-- PDF will be injected here -->
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const pdfFile = params.get('file');
            const viewerContent = document.getElementById('pdf-viewer-content');
            const titleDisplay = document.getElementById('pdf-title');

            if (pdfFile) {
                titleDisplay.textContent = pdfFile.replace(/-/g, ' ').replace('.pdf', '');
                viewerContent.innerHTML = `<embed src="${pdfFile}" type="application/pdf" width="100%" height="100%">`;
            } else {
                titleDisplay.textContent = 'Document Not Found';
                viewerContent.innerHTML = '<p class="error-msg">Error: No PDF file specified.</p>';
            }
        });
    </script>
</body>

</html>
