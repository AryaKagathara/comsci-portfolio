<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer | Arya Kagathara</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
</head>

<body class="viewer-body">
    <nav class="viewer-nav">
        <a href="index.html" class="back-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            Back to Portfolio
        </a>
        <h2 id="pdf-title">Loading Document...</h2>
    </nav>

    <main class="viewer-container">
        <div id="pdf-viewer-content">
            <!-- PDF will be injected here -->
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const pdfFile = params.get('file');
            const viewerContent = document.getElementById('pdf-viewer-content');
            const titleDisplay = document.getElementById('pdf-title');

            if (pdfFile) {
                titleDisplay.textContent = pdfFile.replace(/-/g, ' ').replace('.pdf', '');
                viewerContent.innerHTML = `<embed src="${pdfFile}" type="application/pdf" width="100%" height="100%">`;
            } else {
                titleDisplay.textContent = 'Document Not Found';
                viewerContent.innerHTML = '<p class="error-msg">Error: No PDF file specified.</p>';
            }
        });
    </script>
</body>

</html>
