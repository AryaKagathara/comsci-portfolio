<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arya Kagathara | Design Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <h1>Design Portfolio</h1>
        <p class="subtitle">Showcasing creative excellence and technical precision</p>
    </header>

    <main class="slider-container">
        <!-- Navigation Buttons -->
        <button class="nav-btn prev-btn" aria-label="Previous PDF">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="m15 18-6-6 6-6" />
            </svg>
        </button>
        <button class="nav-btn next-btn" aria-label="Next PDF">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="m9 18 6-6-6-6" />
            </svg>
        </button>

        <!-- Slides Wrapper -->
        <div class="slides-wrapper">
            <div class="slide">
                <embed src="Arya-Kagathara-Design-Portfolio.pdf" type="application/pdf">
            </div>
            <div class="slide">
                <embed src="BLKResumes.pdf" type="application/pdf">
            </div>
            <div class="slide">
                <embed src="Roberto Bolle Foundation.pdf" type="application/pdf">
            </div>
        </div>

        <!-- Pagination -->
        <div class="indicators"></div>
    </main>

    <script src="script.js"></script>
</body>

</html>
